name: Supabase keep-alive

# Mantem o projeto Supabase da Florence ativo (free-tier pausa apos ~7 dias
# sem atividade). Bate direto na REST API a cada 2 dias, lendo a tabela
# publica `keepalive`. Independente do deploy da Vercel.

on:
  schedule:
    - cron: "17 12 */2 * *"   # a cada 2 dias, 12:17 UTC
  workflow_dispatch: {}         # permite rodar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Keep-alive falhou (esperado 200)."
            exit 1
          fi
          echo "Keep-alive OK."
